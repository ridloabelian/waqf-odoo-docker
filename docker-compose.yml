# ==============================================================================
# WAQF ODOO DOCKER COMPOSE CONFIGURATION
# Inisiatif Bersama Forum Wakaf Produktif (FWP) & Asosiasi Nazhir Indonesia (ANI)
# Sistem ERP Wakaf Berstandar PSAK 412 (PSAK 112) & LSP BWI
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE SERVICE (PostgreSQL 17 / 16 Alpine)
  # ----------------------------------------------------------------------------
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: waqf_odoo_db
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c work_mem=16MB
      -c max_connections=100
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - waqf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. WEB SERVICE (Odoo 19.0 Community Edition / Custom Build)
  # ----------------------------------------------------------------------------
  web:
    image: ${ODOO_IMAGE:-odoo:19.0}
    # Jika ingin melakukan build lokal dengan dependensi Python lengkap (PSAK 112, QR Code, Excel),
    # aktifkan baris 'build: .' di bawah ini:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: waqf_odoo_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./extra-addons:/mnt/extra-addons
      - ./waqf_core:/mnt/extra-addons/waqf_core
      - ./l10n_id_waqf_psak112:/mnt/extra-addons/l10n_id_waqf_psak112
    expose:
      - "8069"
      - "8072"
    networks:
      - waqf-network

  # ----------------------------------------------------------------------------
  # 3. REVERSE PROXY SERVICE (Caddy 2 with Auto-HTTPS & WebSockets)
  # ----------------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    container_name: waqf_odoo_proxy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3 Support (QUIC)
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@fwp.or.id}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - waqf-network

# ------------------------------------------------------------------------------
# VOLUMES PERSISTEN
# ------------------------------------------------------------------------------
volumes:
  odoo-web-data:
    name: waqf_odoo_web_data
  odoo-db-data:
    name: waqf_odoo_db_data
  caddy-data:
    name: waqf_caddy_data
  caddy-config:
    name: waqf_caddy_config

# ------------------------------------------------------------------------------
# ISOLASI JARINGAN INTERNAL
# ------------------------------------------------------------------------------
networks:
  waqf-network:
    name: waqf_internal_network
    driver: bridge
